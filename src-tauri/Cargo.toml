[package]
name = "sshgate"
version = "0.1.0"
description = "Map remote web services to friendly .localhost domains over SSH"
authors = ["SSHGate contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "sshgate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
russh = { version = "0.62.4", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8", features = [] }
tauri-plugin-opener = "2.5"
tokio = { version = "1.47", features = ["full"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

